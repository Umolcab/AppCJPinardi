<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Urbano</title>
    <style>
        /* Estilos Generales */
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        h1 { margin-bottom: 5px; font-size: 1.5rem; letter-spacing: 1px; }
        p.subtitle { color: #888; font-size: 0.8rem; margin-bottom: 25px; }

        /* Grilla de Medallas */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* Tarjeta Medalla */
        .medal {
            background-color: #2a2a2a;
            border-radius: 16px;
            padding: 15px 10px;
            cursor: pointer;
            border: 3px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            position: relative;
        }
        
        .medal:active { transform: scale(0.95); }

        .icon { font-size: 2.8rem; filter: grayscale(100%); opacity: 0.3; margin-bottom: 8px; transition: 0.3s;}
        .label { font-size: 0.85rem; font-weight: 600; color: #666; line-height: 1.2; }
        .rank-label { font-size: 0.65rem; text-transform: uppercase; margin-top: 6px; color: #444; font-weight: bold; letter-spacing: 1px; }

        /* ESTILOS DE RANGOS */
        .medal.bronze { border-color: #cd7f32; background: radial-gradient(circle at top, #3d2813 0%, #222 100%); }
        .medal.bronze .icon { filter: sepia(1) saturate(3); opacity: 1; color: #cd7f32; }
        .medal.bronze .rank-label { color: #cd7f32; }

        .medal.silver { border-color: #e0e0e0; background: radial-gradient(circle at top, #4a4a4a 0%, #222 100%); }
        .medal.silver .icon { filter: none; opacity: 1; drop-shadow: 0 0 5px rgba(255,255,255,0.3); }
        .medal.silver .rank-label { color: #e0e0e0; }

        .medal.gold { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); background: radial-gradient(circle at top, #524900 0%, #222 100%); }
        .medal.gold .icon { filter: drop-shadow(0 0 8px gold); opacity: 1; transform: scale(1.1); }
        .medal.gold .rank-label { color: #ffd700; }

        .medal.diamond { 
            border-color: #00e5ff; 
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); 
            background: linear-gradient(135deg, #0d2b33 0%, #000 100%);
            animation: pulse 3s infinite; 
        }
        .medal.diamond .icon { filter: drop-shadow(0 0 10px #00e5ff); opacity: 1; transform: scale(1.2); }
        .medal.diamond .rank-label { color: #00e5ff; }

        @keyframes pulse { 0% { border-color: #00e5ff; } 50% { border-color: #ccf9ff; } 100% { border-color: #00e5ff; } }

        /* MODAL */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center; justify-content: center;
            flex-direction: column;
        }

        .modal-content {
            background: #1e1e1e; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px;
            border: 1px solid #333; text-align: left; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal h3 { margin-top: 0; color: white; text-align: center; }

        /* Estilos del Formulario */
        .description-box {
            width: 100%;
            height: 80px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
            font-family: inherit;
            resize: none;
            box-sizing: border-box; 
            font-size: 0.9rem;
        }
        .description-box:focus { outline: 2px solid #007bff; border-color: transparent; }

        /* Botón Visual de Foto (Fake) */
        .btn-select-photo {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: #333; color: #ccc; padding: 15px; border-radius: 10px;
            font-weight: 600; cursor: pointer; margin-top: 15px; border: 1px dashed #555;
            transition: 0.2s;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-select-photo:active { background: #444; transform: scale(0.98); }

        /* Input Real (Oculto pero funcional) */
        #fileInput { display: none; }

        .preview-container {
            width: 100%; height: 140px; background: #000; border-radius: 10px;
            margin-top: 15px; display: none; overflow: hidden; border: 1px solid #444;
        }
        .preview-img { width: 100%; height: 100%; object-fit: cover; }

        .btn-confirm {
            display: none;
            width: 100%;
            background: linear-gradient(90deg, #007bff, #00d4ff);
            color: white; border: none; padding: 15px; border-radius: 10px;
            font-weight: bold; cursor: pointer; margin-top: 20px;
            font-size: 1rem; box-shadow: 0 5px 15px rgba(0,123,255,0.3);
        }
        .btn-confirm:active { transform: scale(0.98); }

        .btn-close { 
            background: none; border: none; color: #666; margin-top: 15px; width: 100%;
            font-size: 0.85rem; cursor: pointer; text-decoration: underline; padding: 10px;
        }

    </style>
</head>
<body>

    <h1>🕵️ Registro Urbano</h1>
    <p class="subtitle">Inspección y control de incidencias</p>

    <div class="album-grid" id="album"></div>

    <button onclick="resetProgress()" style="margin-top: 40px; background:none; border:none; color:#444; font-size:0.7rem; padding: 20px;">Reiniciar todo</button>

    <input type="file" id="fileInput" accept="image/*">

    <div id="actionModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Título</h3>
            
            <label style="font-size: 0.8rem; color: #aaa; margin-left: 2px;">Razón / Descripción:</label>
            <textarea id="reasonInput" class="description-box" placeholder="Escribe aquí qué has encontrado..."></textarea>

            <div id="previewContainer" class="preview-container">
                <img id="preview" class="preview-img">
            </div>

            <div class="btn-select-photo" id="selectPhotoBtn" onclick="triggerFileClick()">
                <span>📸</span> Seleccionar Evidencia
            </div>

            <button id="confirmBtn" class="btn-confirm" onclick="submitEvidence()">✅ Confirmar y Subir</button>

            <button class="btn-close" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const medals = [
            { id: 1, name: "Ocio Mayores", icon: "👴" },
            { id: 2, name: "Adaptados", icon: "♿" },
            { id: 3, name: "Sostenibles", icon: "🌱" },
            { id: 4, name: "Desperfectos", icon: "🏚️" },
            { id: 5, name: "Malas Señales", icon: "🛑" },
            { id: 6, name: "Vandalismo", icon: "🎨" }
        ];

        const ranks = ['locked', 'bronze', 'silver', 'gold', 'diamond'];
        const rankNames = ['Bloqueado', 'Bronce', 'Plata', 'Oro', 'Diamante'];
        
        let progress = JSON.parse(localStorage.getItem('urbanProgressFixed')) || {};
        let currentMedalId = null;

        const album = document.getElementById('album');
        const modal = document.getElementById('actionModal');
        const fileInput = document.getElementById('fileInput');
        const reasonInput = document.getElementById('reasonInput');
        const previewContainer = document.getElementById('previewContainer');
        const confirmBtn = document.getElementById('confirmBtn');
        const selectPhotoBtn = document.getElementById('selectPhotoBtn');

        function render() {
            album.innerHTML = '';
            medals.forEach(m => {
                let lvl = progress[m.id] || 0;
                let div = document.createElement('div');
                div.className = `medal ${ranks[lvl]}`;
                div.onclick = () => openModal(m.id, m.name, lvl); 
                
                div.innerHTML = `
                    <div class="icon">${m.icon}</div>
                    <div class="label">${m.name}</div>
                    <div class="rank-label">${rankNames[lvl]}</div>
                `;
                album.appendChild(div);
            });
        }

        function openModal(id, name, currentLvl) {
            if (currentLvl >= 4) {
                alert("¡Máximo rango alcanzado! 💎");
                return;
            }
            currentMedalId = id;
            document.getElementById('modalTitle').innerText = name;
            
            // Resetear
            reasonInput.value = "";
            fileInput.value = "";
            previewContainer.style.display = 'none';
            confirmBtn.style.display = 'none';
            selectPhotoBtn.style.display = 'flex';
            selectPhotoBtn.innerHTML = "<span>📸</span> Seleccionar Evidencia";
            selectPhotoBtn.style.background = "#333";
            
            modal.style.display = 'flex';
        }

        function closeModal() { modal.style.display = 'none'; }

        // ESTA ES LA CLAVE: Función que fuerza el clic en el input
        function triggerFileClick() {
            document.getElementById('fileInput').click();
        }

        // DETECTAR CAMBIO EN EL ARCHIVO
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('preview').src = e.target.result;
                    previewContainer.style.display = 'block';
                    
                    selectPhotoBtn.innerHTML = "🔄 Cambiar Foto";
                    selectPhotoBtn.style.background = "#222";
                    confirmBtn.style.display = 'block';
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        function submitEvidence() {
            // VARIABLES GLOBALES PARA LA IMAGEN
        let currentBase64Image = null;

        // AL SELECCIONAR FOTO (CON REDIMENSIONADO)
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    // Creamos una imagen temporal para reducirla de tamaño
                    const img = new Image();
                    img.src = e.target.result;
                    
                    img.onload = () => {
                        // Crear un lienzo (canvas) para redimensionar
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; // Máximo 800px de ancho
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // Convertir a texto comprimido (JPEG calidad 0.7)
                        currentBase64Image = canvas.toDataURL('image/jpeg', 0.7);
                        
                        // Mostrar preview
                        document.getElementById('preview').src = currentBase64Image;
                        previewContainer.style.display = 'block';
                        
                        selectPhotoBtn.innerHTML = "🔄 Cambiar Foto";
                        selectPhotoBtn.style.background = "#222";
                        confirmBtn.style.display = 'block';
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        // AL PULSAR CONFIRMAR - CONEXIÓN CON NEON
        async function submitEvidence() {
            const text = reasonInput.value.trim();
            
            if (text.length < 5) {
                alert("⚠️ Escribe una razón.");
                return;
            }

            confirmBtn.innerHTML = "⏳ Guardando en la nube...";
            confirmBtn.disabled = true;

            try {
                // 1. Enviamos los datos a TU función de Netlify
                const response = await fetch('/.netlify/functions/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        medallaId: currentMedalId,
                        razon: text,
                        imagen: currentBase64Image
                    })
                });

                if (response.ok) {
                    // 2. Si la base de datos dice OK, actualizamos el móvil
                    levelUp(currentMedalId);
                    closeModal();
                    alert("✅ ¡Guardado en la Base de Datos segura!");
                } else {
                    alert("❌ Error al guardar en la nube.");
                }

            } catch (error) {
                console.error(error);
                alert("❌ Error de conexión.");
            } finally {
                confirmBtn.innerHTML = "✅ Confirmar y Subir";
                confirmBtn.disabled = false;
            }
        }
        }

        function levelUp(id) {
            let lvl = progress[id] || 0;
            if (lvl < 4) lvl++;
            progress[id] = lvl;
            localStorage.setItem('urbanProgressFixed', JSON.stringify(progress));
            render();
        }

        function resetProgress() {
            if(confirm("¿Borrar todo el progreso?")) {
                localStorage.removeItem('urbanProgressFixed');
                progress = {};
                render();
            }
        }

        render();
    </script>
</body>
</html>
